name: Natječaji (povlačenje i objava)

on:
  schedule:
    - cron: '20 6,11 * * *'
    - cron: '40 15,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['natjecaji-data.json']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: natjecaji
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pypdf

      - name: Složi stranicu
        run: |
          mkdir -p site
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png site/

      - name: Povuci natječaje
        run: python scrape.py --config config.json --data natjecaji-data.json --out site/natjecaji.json --issue new_items.md

      - name: Spremi popis u repozitorij
        run: |
          git config user.name "natjecaji-bot"
          git config user.email "natjecaji-bot@users.noreply.github.com"
          git add natjecaji-data.json
          git diff --cached --quiet || git commit -m "Popis natječaja $(date -u +%F)"
          git push || true

      - name: Obavijest o novim natječajima (GitHub Issue)
        if: hashFiles('new_items.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.repository_owner }} novi natječaji za specijalizacije:"
            echo
            cat new_items.md
          } > issue_body.md
          gh issue create --title "Novi natječaji ($(date +%d.%m.%Y.))" --body-file issue_body.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
